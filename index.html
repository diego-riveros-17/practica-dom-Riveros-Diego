<!doctype html>
<html lang="es" class="vh-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practica DOM</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header
      class="bg-black d-flex flex-column justify-content-center align-items-center"
    >
      <h1 class="text-warning">SuperHeroes</h1>
    </header>

    <main>
      <!-- Seccion agregar superheroe y buscar superheroe -->
      <section class="container-fluid">
        <div class="row p-4 justify-content-around">
          <div class="list-group col-4">
            <form id="cargarSuperheroe">
              <div class="mb-3">
                <label for="nombreSuperheroe" class="form-label"
                  >Nombre SuperHeroe</label
                >
                <input
                  type="text"
                  class="form-control"
                  name="nombreSuperheroe"
                  id="nombreSuperheroe"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="imageSuperheroe" class="form-label"
                  >Url imagen</label
                >
                <input
                  type="url"
                  class="form-control"
                  name="imageSuperheroes"
                  id="imageSuperheroe"
                  required
                />
              </div>

              <button
                type="submit"
                class="btn btn-primary"
                id="btnCargarSuperheroe"
              >
                Cargar SuperHeroe
              </button>
            </form>
          </div>

          <!-- Buscar superheroe -->
          <div class="list-group col-4">
            <form id="buscarSuperheroe">
              <div class="mb-3">
                <label for="nameSuperheroe" class="form-label"
                  >Buscar por nombre</label
                >
                <input
                  type="text"
                  class="form-control"
                  name="nameSuperheroe"
                  id="nameSuperheroe"
                />
              </div>
            </form>
          </div>
        </div>
      </section>

      <!-- Seccion cards personajes -->
      <section class="container-fluid">
        <div class="row text-center" id="cardSuperheroe"></div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="py-3 mt-auto bg-black" id="footer">
      <p class="text-center text-warning">&copy; 2026 SuperHeroes</p>
    </footer>

    <script src="assets/js/app.js"></script>
  </body>
</html>
